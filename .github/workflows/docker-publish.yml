name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: |
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/mark-it-down:latest
            ghcr.io/${{ env.REPO_OWNER }}/mark-it-down:${{ github.sha }}

      - name: Install doctl
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Connect to DigitalOcean Kubernetes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: doctl kubernetes cluster kubeconfig save k8s-1-36-0-do-0-lon1-1779874547211

      - name: Update image in Kubernetes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          kubectl set image deployment/markitdown \
            markitdown=ghcr.io/${{ env.REPO_OWNER }}/mark-it-down:${{ github.sha }}
